@if (!expeditions) {
<p>Loading data...</p>
} @else if (expeditions && expeditions.length === 0) {
<div class="container p-3">
    <h1>Expeditions</h1>
    <a routerLink="new" class="btn btn-primary mb-3">Create Expedition</a>
    <p>No expeditions were found.</p>
</div>

} @else {

<div class="container p-3">
    <h1>Expeditions</h1>
    <a routerLink="new" class="btn btn-primary mb-3">Create Expedition</a>
    <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let expedition of expeditions">
            <div class="card shadow-sm">
                <img
                    [src]="expedition.imageUrl"
                    alt="{{ expedition.title }}"
                    class="card-img-top"
                    style="height: 200px; object-fit: cover"
                />
                <div class="card-body p-4">
                    <h5 class="card-title">{{ expedition.title }}</h5>
                    <div
                        class="d-flex justify-content-between align-items-center"
                    >
                        <a
                            routerLink="{{ expedition._id }}"
                            class="btn btn-outline-primary"
                        >
                            Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
}
